<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f6fb">
    <title>B 面 · 本地音乐播放器</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/styles.css">
    <script type="module" src="/static/player.js"></script>
  </head>
  <body>
    <svg class="icons" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M7 12a5 5 0 0 1 5-5m5 5a5 5 0 0 1-5 5"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h15M4 11h15M4 16h8m7 1v-3m0 3v3m0-3h3m-3 0h-3"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a4 4 0 0 0 6 .4l3-3a4 4 0 0 0-5.7-5.7l-1.7 1.7m2.4 4.6a4 4 0 0 0-6-.4l-3 3a4 4 0 0 0 5.7 5.7l1.7-1.7"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 17V5l11-2v12M9 8l11-2"/><ellipse cx="6" cy="17" rx="3" ry="2.5"/><ellipse cx="17" cy="15" rx="3" ry="2.5"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path class="solid" d="M8 5v14l11-7Z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path class="solid" d="M7 5h4v14H7zM14 5h4v14h-4z"/></symbol>
      <symbol id="i-previous" viewBox="0 0 24 24"><path class="solid" d="M19 5v14L9 12zM5 5h2v14H5z"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path class="solid" d="M5 5v14l10-7zM17 5h2v14h-2z"/></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM15 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM16 9l5 6m0-6-5 6"/></symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 6h3c5 0 6 12 11 12h4m-4-4 4 4-4 4M3 18h3c1.5 0 2.5-1 3.5-2.7M14 8.7C15 7 16 6 17 6h4m-4-4 4 4-4 4"/></symbol>
      <symbol id="i-order" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M13 5h6v6m0-6-8 8m6 1v5H5V7h5"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    </svg>

    <div class="workspace">
      <aside class="sidebar">
        <a class="brand" href="/" aria-label="B 面首页">
          <span class="brand-mark"><svg><use href="#i-disc"/></svg></span>
          <span>B 面<span class="brand-caption">本地音乐播放器</span></span>
        </a>
        <nav aria-label="音乐库">
          <a class="nav-link" href="#library" aria-current="page"><svg><use href="#i-list"/></svg>我的歌单</a>
        </nav>
        <div class="sidebar-footer"><span></span> 本地音乐库</div>
      </aside>

      <main class="main">
        <section class="hero" aria-labelledby="page-title">
          <div class="hero-text">
            <h1 id="page-title">我的歌单</h1>
            <p>把喜欢的 B 站视频，变成随时能听的音乐。</p>
          </div>
          <div class="record-art" aria-hidden="true">
            <div class="record-sleeve"></div>
            <div class="record"><div class="record-label"><svg><use href="#i-music"/></svg></div></div>
          </div>
        </section>

        <section class="import-card" aria-labelledby="import-title">
          <div class="import-heading">
            <div class="import-icon"><svg><use href="#i-link"/></svg></div>
            <div><h2 id="import-title">导入 B 站视频</h2><p id="import-hint">支持视频链接和 b23.tv 短链接</p></div>
          </div>
          <form id="import-form">
            <label class="sr-only" for="video-url">B 站视频链接</label>
            <input id="video-url" type="text" maxlength="2048" placeholder="粘贴 B 站视频链接" aria-describedby="import-hint" autocomplete="off" spellcheck="false" required>
            <button id="import-button" class="primary-button" type="submit"><svg><use href="#i-plus"/></svg><span>导入音频</span></button>
          </form>
          <p id="import-status" class="status" role="status" hidden></p>
        </section>

        <section id="library" class="library" aria-labelledby="library-title">
          <div class="section-heading">
            <div><h2 id="library-title">播放列表</h2><span id="track-count">0 首歌曲</span></div>
            <div class="mode-switch" role="group" aria-label="播放模式">
              <button type="button" data-mode="ordered" aria-pressed="true"><svg><use href="#i-order"/></svg>顺序</button>
              <button type="button" data-mode="shuffle" aria-pressed="false"><svg><use href="#i-shuffle"/></svg>随机</button>
            </div>
          </div>
          <div class="track-panel">
            <div class="track-header" aria-hidden="true"><span>#</span><span>歌曲</span><span>UP 主</span><span><svg><use href="#i-clock"/></svg></span><span></span></div>
            <ol id="track-list" class="track-list" aria-label="歌曲" hidden></ol>
            <div id="empty-state" class="empty-state">
              <span class="empty-icon"><svg><use href="#i-music"/></svg></span>
              <h3>歌单还是空的</h3>
              <p>粘贴一个 B 站视频链接，添加你的第一首歌。</p>
            </div>
          </div>
          <p id="player-status" class="status" role="status" hidden></p>
        </section>
      </main>
    </div>

    <footer class="player" aria-label="播放器">
      <div class="now-playing">
        <span id="now-cover" class="cover"><svg><use href="#i-music"/></svg></span>
        <div><strong id="now-title">未选择歌曲</strong><span id="now-artist">从歌单中选择一首歌</span></div>
      </div>
      <div class="transport">
        <div class="transport-buttons">
          <button id="previous" class="icon-button" type="button" aria-label="上一首" title="上一首" disabled><svg><use href="#i-previous"/></svg></button>
          <button id="play" class="icon-button play-button" type="button" aria-label="播放" title="播放" disabled><svg><use href="#i-play"/></svg></button>
          <button id="next" class="icon-button" type="button" aria-label="下一首" title="下一首" disabled><svg><use href="#i-next"/></svg></button>
        </div>
        <div class="timeline">
          <span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="1" value="0" step="0.1" aria-label="播放进度" disabled><span id="duration">0:00</span>
        </div>
      </div>
      <div class="volume">
        <button id="mute" class="icon-button" type="button" aria-label="静音" title="静音" aria-pressed="false"><svg><use href="#i-volume"/></svg></button>
        <input id="volume" type="range" min="0" max="1" value="0.75" step="0.01" aria-label="音量">
      </div>
      <audio id="audio" preload="metadata"></audio>
    </footer>
  </body>
</html>
